aid: place
name: PLACE
description: 'PLACE, Inc. is a Bellingham, Washington real estate technology and business-services
  company founded in 2020 by Ben Kinney and Chris Suarez. It sells an end-to-end operating
  platform to real estate teams, agents and brokerages — a CRM with lead-generation
  websites, transaction management, automated marketing, mobile apps and AI tooling —
  bundled with shared back-office services covering accounting, hiring, training,
  finance and digital advertising, plus adjacent mortgage, title and escrow, insurance,
  property management and home-services offerings. PLACE partners with teams in 500+
  locations across the United States and Canada, raised a $100M Series A led by a
  division of Goldman Sachs Asset Management at unicorn valuation, and acquired MLS
  data platform Remine to extend its technology ecosystem. The platform is delivered
  only to contracted teams behind single sign-on; PLACE publishes no public API,
  developer portal, SDK or machine-readable specification.'
